# 电脑难度阶梯：改了 AI 或侠客数据后，跑各难度之间的胜率对照，确认难度一档比一档强。
# 本地复现：node tools/ai/ai-ladder-report.mjs --n 2
name: AI Difficulty Ladder & Win-Rate Report

on:
  push:
    branches: [ main ]
    paths:
      - "src/ai.js"
      - "src/data/**"
      - "src/game/**"
      - "src/models/ai-brain.json"
      - "tools/ai/ai-arena.mjs"
      - "tools/ai/ai-ladder-report.mjs"
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-ladder:
    if: github.event_name != 'pull_request'
    name: Benchmark AI Ladder & Update Markdown Report
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run Adjacent Difficulty Ladder Benchmark & Generate Markdown
        run: node tools/ai/ai-ladder-report.mjs --n 2 --out docs/ai/ai-ladder-benchmark.md

      - name: Auto-Commit Updated AI Ladder Win-Rate Report
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet docs/ai/ai-ladder-benchmark.md; then
            git config user.name "AMFI-Disable"
            git config user.email "evengao6688@gmail.com"
            git add docs/ai/ai-ladder-benchmark.md
            git commit -m "chore: update ai ladder"
            git push origin HEAD:main
          else
            echo "docs/ai/ai-ladder-benchmark.md is already up to date."
          fi
