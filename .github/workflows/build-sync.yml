# 构建门禁：python3 tools/build.py --check 确认生成文件（index.html、worker.js 等）和源码一致、语法没错。
# 失败多半是改了 src/ 却没重新构建：本地跑 python3 tools/build.py，把生成文件一起提交。
name: Build & Syntax Gate

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "assets/**"
      - "cloudflare/**"
      - "tools/build.py"
      - "tools/checks/data-check.mjs"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-gate:
    if: github.event_name != 'pull_request'
    name: Bundle Sync & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate Build Script & Lowercase Filenames
        run: |
          python3 -m py_compile tools/build.py
          # CNAME (GitHub Pages) is the only name that must stay in capitals.
          if git ls-files | grep -vE '^CNAME$' | grep '[A-Z]'; then
            echo "Error: uppercase tracked files found"
            exit 1
          fi

      - name: Verify Generated Bundles Are Up To Date
        run: python3 tools/build.py --check
