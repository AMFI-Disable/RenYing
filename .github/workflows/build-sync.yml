name: Build & Syntax Gate

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "assets/**"
      - "cloudflare/**"
      - "tools/build.py"
      - "tools/data-check.mjs"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-gate:
    name: Bundle Sync & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate Build Script & Lowercase Filenames
        run: |
          python3 -m py_compile tools/build.py
          # CNAME (GitHub Pages) and CLAUDE.md (Claude Code) are the two names that must stay in capitals.
          if git ls-files | grep -vE '^(CNAME|CLAUDE\.md)$' | grep '[A-Z]'; then
            echo "Error: uppercase tracked files found"
            exit 1
          fi

      - name: Verify Generated Bundles Are Up To Date
        run: python3 tools/build.py --check
