# 统一主 CI：push(main) 与 pull_request 共用路径分组（tools/ci/change-groups.py），
# 合并预检/Node/浏览器审计为 4 个并行任务，减少重复虚拟机启动与网页服务器初始化耗时。
# 全部本地复现：node tools/tests/test.mjs
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight And Repo Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      all: ${{ steps.classify.outputs.all }}
      game: ${{ steps.classify.outputs.game }}
      ai: ${{ steps.classify.outputs.ai }}
      cloud: ${{ steps.classify.outputs.cloud }}
      economy: ${{ steps.classify.outputs.economy }}
      worker: ${{ steps.classify.outputs.worker }}
      browser: ${{ steps.classify.outputs.browser }}
      offline: ${{ steps.classify.outputs.offline }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Environment
        uses: ./.github/actions/setup-ci
        with:
          python: "true"

      - name: Classify Changed Files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 tools/ci/change-groups.py "$BASE_SHA" "$HEAD_SHA" "$GITHUB_OUTPUT"

      - name: Validate Scripts, YAML, Filenames, And Entrypoints
        run: |
          python3 -m py_compile tools/build.py tools/ci/change-groups.py
          ruby -ryaml -e 'Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.safe_load(File.read(f)); puts "Validated: #{f}" }'
          if git ls-files | grep -vE '^CNAME$' | grep '[A-Z]'; then
            echo "Error: uppercase tracked files found"
            exit 1
          fi
          test -f index.html
          test -f renying.html
          test -f renying-offline.html

      - name: Verify Generated Pages Are Up To Date
        run: python3 tools/build.py --check

      - name: Verify Commit Message Conventions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -c '
          import subprocess, re, os
          pattern = re.compile(r"^[a-z]+: [a-z0-9]+ [a-z0-9]+ [a-z0-9]+$")
          base_sha = os.environ.get("BASE_SHA", "")
          if base_sha and not re.match(r"^0+$", base_sha):
              rev_range = f"{base_sha}..HEAD"
          else:
              rev_range = "HEAD~1..HEAD"
          try:
              commits = subprocess.check_output(["git", "log", rev_range, "--format=%H %s"]).decode().strip().split("\n")
          except Exception:
              commits = subprocess.check_output(["git", "log", "-1", "--format=%H %s"]).decode().strip().split("\n")
          for commit in (c for c in commits if c.strip()):
              sha, message = commit.split(" ", 1)
              if not message.startswith("Merge ") and not pattern.match(message):
                  raise SystemExit(f"Invalid commit message {sha[:7]}: {message}")
          print("Commit message conventions passed.")
          '

  node-checks:
    name: Node Game, Cloud, Economy And Worker Checks
    needs: preflight
    if: >
      needs.preflight.outputs.all == 'true' ||
      needs.preflight.outputs.game == 'true' ||
      needs.preflight.outputs.cloud == 'true' ||
      needs.preflight.outputs.economy == 'true' ||
      needs.preflight.outputs.worker == 'true' ||
      needs.preflight.outputs.offline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Node
        uses: ./.github/actions/setup-ci

      - name: Game Data, Combat, Rollback, Netplay And Anti-Cheat
        if: needs.preflight.outputs.game == 'true' || needs.preflight.outputs.all == 'true'
        run: |
          node tools/checks/data-check.mjs --strict-copy
          node tools/checks/hero-completeness.mjs
          node tools/checks/frame-data.mjs --check
          node tools/tests/combat-test.mjs --sim
          node tools/tests/rollback-test.mjs --rollback
          node tools/tests/netplay-test.mjs
          node tools/tests/anticheat-test.mjs
          node tools/tests/ai-lingque-test.mjs

      - name: Cloud Save, Sync And Open World
        if: needs.preflight.outputs.cloud == 'true' || needs.preflight.outputs.all == 'true'
        run: |
          node tools/tests/cloud-test.mjs
          node tools/tests/sync-test.mjs
          node tools/tests/sync-test.mjs --bundle
          node tools/tests/world-test.mjs

      - name: Armory And Economy
        if: needs.preflight.outputs.economy == 'true' || needs.preflight.outputs.all == 'true'
        run: |
          node tools/tests/econ-test.mjs
          node tools/tests/econ-test.mjs --bundle

      - name: Worker Schema, Predeploy And Wrangler Dry-Run
        if: needs.preflight.outputs.worker == 'true' || needs.preflight.outputs.all == 'true'
        run: |
          node --input-type=module --check < cloudflare/worker.bundle.js
          node tools/tests/rollback-test.mjs --schema
          node tools/tests/predeploy-check.mjs
          node tools/tests/predeploy-check.mjs --source
          # wrangler.toml 在 cloudflare/ 里，要在这个目录跑，不然 wrangler 找不到配置会直接失败
          cd cloudflare
          npx --yes wrangler@4.154.0 deploy --dry-run --env="" --outdir "$RUNNER_TEMP/wrangler-prod"
          npx --yes wrangler@4.154.0 deploy --dry-run --env staging --outdir "$RUNNER_TEMP/wrangler-staging"

      - name: Offline Standalone And QFX 3D Bundles
        if: needs.preflight.outputs.offline == 'true' || needs.preflight.outputs.all == 'true'
        run: |
          node tools/tests/rollback-test.mjs --offline
          node tools/tests/rollback-test.mjs --qfx

  ai:
    name: AI Simulation Checks
    needs: preflight
    if: needs.preflight.outputs.ai == 'true' || needs.preflight.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Node
        uses: ./.github/actions/setup-ci

      - name: Run AI Simulation Suite
        run: node tools/tests/test-ai.mjs

  browser-audits:
    name: Browser Flow, UI, Mobile And Performance Audits
    needs: preflight
    if: needs.preflight.outputs.browser == 'true' || needs.preflight.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Environment And Static Server
        uses: ./.github/actions/setup-ci
        with:
          python: "true"
          http-server: "true"

      - name: Run Browser Flow And Keyboard Navigation
        run: |
          node tools/audits/bp-flow-test.mjs
          node tools/audits/kb-flow-test.mjs ci-kb 1440 900
          node tools/audits/kb-flow-test.mjs ci-kb-en 844 390 --en

      - name: Run UI Layout, HUD And Touch Audits
        run: |
          node tools/audits/ui-audit.mjs ci-ui 1440 900
          node tools/audits/hud-audit.mjs ci-hud 1440 900
          node tools/audits/hud-overlap-audit.mjs ci-hud-ov 1440 900 watch2v2
          node tools/audits/touch-audit.mjs ci-touch
          node tools/audits/en-coverage-audit.mjs ci-en 1440 900

      - name: Run First Load And Frame Budget Audits
        run: |
          node tools/audits/perf-audit.mjs ci-perf
          node tools/audits/firstload-audit.mjs ci-firstload 3

  quality:
    name: Codebase & Syntax Validation
    if: always()
    needs:
      - preflight
      - node-checks
      - ai
      - browser-audits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require All Applicable Checks To Pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["JOB_RESULTS"]).items()}
          failed = {name: result for name, result in results.items() if result not in ("success", "skipped")}
          if failed:
              print("Required checks failed or were cancelled:", failed)
              sys.exit(1)
          print("All applicable checks passed.")
          PY
