name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  quality:
    name: Codebase & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate Build Script Syntax
        run: |
          python3 -m py_compile tools/build.py
          echo "tools/build.py syntax valid."

      - name: Validate YAML Files
        run: |
          ruby -ryaml -e '
            Dir.glob(".github/**/*.{yml,yaml}").each do |f|
              YAML.safe_load(File.read(f))
              puts "Validated: #{f}"
            end
          '

      - name: Verify Lowercase Filenames
        run: |
          if git ls-files | grep -v '^CNAME$' | grep '[A-Z]'; then
            echo "Error: uppercase tracked files found"
            exit 1
          fi
          echo "All tracked files are lowercase."

      - name: Verify Core Game Entrypoints
        run: |
          test -f index.html
          test -f renying.html
          test -f renying-offline.html
          echo "All HTML entrypoints verified."

      - name: Verify Generated Pages Are Up To Date
        run: python3 tools/build.py --check

      - name: Armory Economy & Anti-Cheat Server Tests
        run: |
          node tools/econ-test.mjs
          node tools/econ-test.mjs --bundle

      # Runs src/cloud.js in Node with a fake Worker: per-account save isolation, a pending
      # save that must not follow an account switch, no retry storm on a 4xx refusal,
      # non-Latin-1 passwords for local accounts, and full-profile export signatures.
      - name: Cloud Save Client Tests
        run: node tools/cloud-test.mjs

      - name: Run Combat & AI Regression Suite
        run: node tools/combat-test.mjs --sim

      - name: Start Static Web Server for Browser Audits
        run: |
          python3 -m http.server 8791 > /tmp/renying-http.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8791/ >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8791/ >/dev/null || { echo "http server failed to start"; cat /tmp/renying-http.log; exit 1; }
          echo "Static web server is up on :8791"

      - name: UI Panel Layout Audit (all panels, 1440x900)
        run: node tools/ui-audit.mjs ci-ui 1440 900

      - name: Canvas HUD Text Audit
        run: node tools/hud-audit.mjs ci-hud 1440 900

      - name: Mobile / Touch Layout Audit
        run: node tools/touch-audit.mjs ci-touch

      - name: Verify Commit Message Conventions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -c '
          import subprocess, re, os
          pattern = re.compile(r"^[a-z]+: [a-z0-9]+ [a-z0-9]+ [a-z0-9]+$")
          base_sha = os.environ.get("BASE_SHA", "")

          if base_sha and not re.match(r"^0+$", base_sha):
              rev_range = f"{base_sha}..HEAD"
          else:
              rev_range = "HEAD~1..HEAD"

          try:
              commits = subprocess.check_output(["git", "log", rev_range, "--format=%H %s"]).decode().strip().split("\n")
          except Exception:
              commits = subprocess.check_output(["git", "log", "-1", "--format=%H %s"]).decode().strip().split("\n")

          commits = [c for c in commits if c.strip()]
          for c in commits:
              sha, msg = c.split(" ", 1)
              if msg.startswith("Merge "):
                  continue
              if not pattern.match(msg):
                  raise SystemExit(f"Invalid commit message {sha[:7]}: {msg}")
          print(f"Validated {len(commits)} commit messages.")
          '
