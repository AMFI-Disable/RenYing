name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  quality:
    name: Codebase & Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Python Server Syntax
        run: |
          python3 -m py_compile server.py tools/build.py
          echo "server.py and tools/build.py syntax valid."

      - name: Validate YAML Files
        run: |
          ruby -ryaml -e '
            Dir.glob(".github/**/*.{yml,yaml}").each do |f|
              YAML.safe_load(File.read(f))
              puts "Validated: #{f}"
            end
          '

      - name: Verify Lowercase Filenames
        run: |
          if git ls-files | grep '[A-Z]'; then
            echo "Error: uppercase tracked files found"
            exit 1
          fi
          echo "All tracked files are lowercase."

      - name: Verify Core Game Entrypoints
        run: |
          test -f index.html
          test -f renying.html
          test -f renying-offline.html
          echo "All HTML entrypoints verified."

      - name: Verify Generated Pages Are Up To Date
        run: python3 tools/build.py --check

      # Headless UI + multiplayer gates. Chrome is preinstalled on ubuntu-latest; set
      # RENYING_CHROME to override the path, RENYING_URL to point at another host.
      # The WebRTC P2P check is deliberately NOT run here: it depends on the public
      # PeerJS signalling server and outbound UDP, which would make CI flaky.
      # Run it locally with:  node tools/net-test.mjs p2p,errtest
      - name: Start Local Game Server
        run: |
          python3 server.py 8791 > /tmp/renying-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8791/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8791/health >/dev/null || { echo "server failed to start"; cat /tmp/renying-server.log; exit 1; }
          echo "Local server is up on :8791"

      # Fails on clipped/off-screen text or sub-12px text. Scrolling is reported but not
      # fatal (a taller panel scrolls rather than clipping) - add RENYING_STRICT: "1"
      # to also require every panel to fit the viewport.
      - name: UI Panel Layout Audit (all panels, 1440x900)
        run: node tools/ui-audit.mjs ci-ui 1440 900

      # Instrumented canvas-text audit: drives a real match through many states and
      # fails if any HUD label is drawn below 12px.
      - name: Canvas HUD Text Audit
        run: node tools/hud-audit.mjs ci-hud 1440 900

      # Emulates phones/tablets: verifies the touch path activates, the virtual stick
      # and thumb pad are on-screen with usable hit targets, and that synthetic touches
      # actually move and attack.
      - name: Mobile / Touch Layout Audit
        run: node tools/touch-audit.mjs ci-touch

      - name: Multiplayer Regression (LAN / dedicated server)
        run: node tools/net-test.mjs server ci-net

      - name: Verify Commit Message Conventions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -c '
          import subprocess, re, os
          pattern = re.compile(r"^[a-z]+: [a-z0-9]+ [a-z0-9]+ [a-z0-9]+$")
          base_sha = os.environ.get("BASE_SHA", "")

          if base_sha and not re.match(r"^0+$", base_sha):
              rev_range = f"{base_sha}..HEAD"
          else:
              rev_range = "HEAD~1..HEAD"

          try:
              commits = subprocess.check_output(["git", "log", rev_range, "--format=%H %s"]).decode().strip().split("\n")
          except Exception:
              commits = subprocess.check_output(["git", "log", "-1", "--format=%H %s"]).decode().strip().split("\n")

          commits = [c for c in commits if c.strip()]
          for c in commits:
              sha, msg = c.split(" ", 1)
              if msg.startswith("Merge "):
                  continue
              if not pattern.match(msg):
                  raise SystemExit(f"Invalid commit message {sha[:7]}: {msg}")
          print(f"Validated {len(commits)} commit messages.")
          '
