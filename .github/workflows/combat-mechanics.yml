# 战斗与物理：无画面沙盒里模拟对打，检查招式、受击、连段、物理这些规则。
# 本地复现：node tools/tests/combat-test.mjs --sim
name: Combat & Physics Engine

on:
  push:
    branches: [ main ]
    paths:
      - "src/data/**"
      - "src/game/**"
      - "src/ai.js"
      - "tools/tests/combat-test.mjs"
      - "tools/ai/ai-code.mjs"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  combat-suite:
    if: github.event_name != 'pull_request'
    name: 12-Hero Combat & Mode Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run 12-Hero Combat & 2v2 Regression Suite
        run: node tools/tests/combat-test.mjs --sim
