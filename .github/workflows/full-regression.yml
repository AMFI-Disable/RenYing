# 每天定时的全量回归：把所有测试都跑一遍（和本地 node tools/tests/test.mjs 一样）。
name: Full Regression

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression
  cancel-in-progress: false

jobs:
  full-suite:
    name: Full Game, Cloud, And Economy Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Environment
        uses: ./.github/actions/setup-ci
        with:
          python: "true"

      - name: Run Full Regression Suite
        run: node tools/tests/test.mjs

      - name: Run Layered Arena Self-Play
        run: |
          node tools/ai/ai-arena.mjs --mode melee --heroes 16 --opponent 19 --n 2 --workers 2
          node tools/ai/ai-arena.mjs --mode ctf --heroes 17 --opponent 18 --n 2 --workers 2

      - name: Live Worker Health Probe (Non-Fatal)
        run: curl -sf --max-time 10 https://renying.evengao6688.workers.dev/api/health || echo "Health probe skipped or unreachable"
