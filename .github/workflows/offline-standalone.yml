# 离线版：确认 renying-offline.html 双击打开也能玩（不依赖网络和服务器）。
# 本地复现：node tools/tests/rollback-test.mjs --offline
name: Offline Standalone Build

on:
  push:
    branches: [ main ]
    paths:
      - "renying-offline.html"
      - "tools/build.py"
      - "tools/tests/rollback-test.mjs"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  offline-bundle:
    if: github.event_name != 'pull_request'
    name: Zero-Network Standalone Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify Standalone Offline HTML Bundle & Embedded Payloads
        run: node tools/tests/rollback-test.mjs --offline
