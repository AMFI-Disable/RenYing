# 青锋行（三维小游戏）冒烟测试：检查 assets/qingfengxing.html 的打包和各模块是否完整。
# 本地复现：node tools/tests/rollback-test.mjs --qfx
name: QingFengXing 3D Action Mode

on:
  push:
    branches: [ main ]
    paths:
      - "src/qfx/**"
      - "assets/qingfengxing.html"
      - "assets/three.min.js"
      - "tools/build.py"
      - "tools/tests/rollback-test.mjs"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  qfx-smoke:
    if: github.event_name != 'pull_request'
    name: QingFengXing 3D Module & Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify QingFengXing 3D Bundle & Modules
        run: node tools/tests/rollback-test.mjs --qfx
