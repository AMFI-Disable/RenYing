# 回滚联机：同样的输入两边算出一样的结果（确定性），回滚重算后状态一致；netplay-test 测直连收发。
# 本地复现：node tools/tests/rollback-test.mjs --rollback、node tools/tests/netplay-test.mjs
name: Rollback Netcode & P2P Sync

on:
  push:
    branches: [ main ]
    paths:
      - "src/net-p2p.js"
      - "src/data/**"
      - "src/game/**"
      - "tools/tests/rollback-test.mjs"
      - "tools/tests/netplay-test.mjs"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  rollback:
    if: github.event_name != 'pull_request'
    name: Deterministic Rollback Resimulation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify Rollback Snapshot & Resimulation Determinism
        run: node tools/tests/rollback-test.mjs --rollback

      # Two sandboxed copies of the game joined by a fake laggy link, both mashing random inputs;
      # every match must come out identical on both sides.
      - name: Two-Player Netplay Determinism
        run: node tools/tests/netplay-test.mjs
