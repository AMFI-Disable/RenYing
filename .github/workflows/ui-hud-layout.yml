name: UI Panels & Canvas HUD Layout

on:
  push:
    branches: [ main ]
    paths:
      - "src/page.html"
      - "src/style.css"
      - "src/data/**"
      - "src/game/**"
      - "src/armory.js"
      - "src/social.js"
      - "tools/ui-audit.mjs"
      - "tools/hud-audit.mjs"
      - "tools/hud-overlap-audit.mjs"
      - "tools/kb-flow-test.mjs"
      - "tools/perf-audit.mjs"
      - "tools/perf-budget.json"
      - "tools/firstload-audit.mjs"
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ui-hud:
    name: Headless Browser UI & Canvas HUD Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Start Static Web Server
        run: |
          python3 -m http.server 8791 > /tmp/renying-http.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8791/ >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8791/ >/dev/null || { echo "http server failed to start"; cat /tmp/renying-http.log; exit 1; }
          echo "Static web server is up on :8791"

      - name: Run UI Panel Layout Audit (1440x900)
        run: |
          set +e
          node tools/ui-audit.mjs ci-ui 1440 900 2>&1 | tee /tmp/ui-audit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the audit's own verdict as check annotations: this audit is timing sensitive, so the
            # next failure should say which panel and which measurement, not just "exit code 1".
            grep -E 'FAIL|ERROR|overflow|^     ' /tmp/ui-audit.log | head -25 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          exit "$status"

      # Keyboard-only flow (home, single mode, draft, match, results, home) on a short landscape window in English;
      # ci.yml runs it at 1440x900 in Chinese.
      - name: Keyboard-Only Flow Test (844x390, English)
        run: node tools/kb-flow-test.mjs ci-kb 844 390 --en

      - name: Run Canvas HUD Text & Overlap Audit
        run: |
          node tools/hud-audit.mjs ci-hud 1440 900
          node tools/hud-overlap-audit.mjs ci-hud-ov 1440 900 watch2v2

      # Load to main menu, panel switch to next frame, and AI-vs-AI 1v1 / 2v2 frame rate,
      # checked against tools/perf-budget.json (measured, then loosened about 3x).
      - name: Performance Budget Audit
        run: node tools/perf-audit.mjs ci-perf

      # Cold first load: fails if a web font can hide text (font-display block/auto) or if music or the
      # Qingfengxing page is requested on the first screen. Timings and sizes are reported only.
      - name: First Load Audit (Fonts, Music, Deferred Pages)
        run: node tools/firstload-audit.mjs ci-firstload 3
