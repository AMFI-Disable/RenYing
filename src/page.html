<!-- 刃影主页面的骨架：tools/build.py 把下面几个 @ 占位标记换成样式和脚本，生成根目录的 index.html（每个标记只能有一个）。
     @style 全部样式（src/style.css + src/styles/）；@music 背景音乐（只有离线版内嵌）；@scripts 游戏和各模块的脚本；@qfx 青锋行。
     每个界面是 #wrap 里一个 class="scr" 的 div（菜单 #menu、单人 #single、联机 #netp、点将台 #bp、账号 #acc、
     武库 #armory、任务 #tasks、结算 #end ……），showScreen(id)（src/game/05-ui/21-buttons-01-screen-controls.js）按一张固定的名单
     切换 on，新加的界面要记得加进那张名单。
     找 bug 提示：某个界面打不开，先看这里有没有那个 id；按钮没反应去 src/game/21-buttons-*.js 找它的 id。 -->
<script>try { if (localStorage.getItem('renying-lang') === 'en') document.documentElement.classList.add('boot-en'); } catch (e) {}</script>   <!-- 以前选过英文：首页一开始就给顶栏留位置（style.css 的 html.boot-en） -->

<style id="bootCss">
/* 启动画面和通用加载幕（#boot 在 body 最前面，网页一到就画；加载幕 .ry-veil 由 src/game/05-ui/21-buttons-04-loading.js 按需放进某个容器）。
   只用 transform / opacity 做动画：主线程忙着解析脚本时，这些动画仍然由合成线程继续播，不会停住。 */
#boot, .ry-veil { background: radial-gradient(ellipse 70% 55% at 50% 42%, #1b1d3d 0%, #0e1026 55%, #070812 100%); color: #efe8d8; display: grid; place-items: center; overflow: hidden; }
#boot { position: fixed; inset: 0; z-index: 100000; transition: opacity .45s ease, visibility 0s linear .45s; }
#boot.out { opacity: 0; visibility: hidden; pointer-events: none; }
.ry-veil { position: absolute; inset: 0; z-index: 3; transition: opacity .3s ease, visibility 0s linear .3s; }
.ry-veil.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.ry-moon { position: absolute; width: min(34vmin, 260px); aspect-ratio: 1; border-radius: 50%; right: 14%; top: 12%; background: radial-gradient(circle at 38% 36%, rgba(255,244,222,.5), rgba(220,205,235,.16) 60%, rgba(220,205,235,0) 72%); opacity: .8; }
.ry-mist { position: absolute; left: -10%; right: -10%; bottom: -8%; height: 38%; background: linear-gradient(0deg, rgba(120,110,170,.22), rgba(120,110,170,0)); }
.ry-core { position: relative; display: grid; justify-items: center; gap: 10px; padding: 0 24px; text-align: center; }
.ry-seal { width: 46px; height: 46px; display: grid; place-items: center; background: #b5282d; color: #f6e9d0; font: 700 26px/1 "Ma Shan Zheng", "Noto Serif SC", serif; border-radius: 4px; transform: rotate(-4deg); box-shadow: 0 0 22px rgba(181,40,45,.45); }
.ry-title { margin: 6px 0 0; font: 400 clamp(44px, 9vmin, 76px)/1.05 "Ma Shan Zheng", "Noto Serif SC", "Songti SC", serif; letter-spacing: .18em; padding-left: .18em; background: linear-gradient(180deg, #fbefcf, #e0b35a 70%, #a9782a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 18px rgba(0,0,0,.55)); }
.ry-sub { font: 600 11px/1 Cinzel, serif; letter-spacing: .5em; padding-left: .5em; color: rgba(239,232,216,.5); }
.ry-bar { position: relative; width: min(280px, 64vw); height: 3px; margin-top: 18px; border-radius: 2px; background: rgba(239,232,216,.12); overflow: hidden; }
.ry-fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(.04); background: linear-gradient(90deg, #b5282d, #e0b35a); transition: transform .35s cubic-bezier(.2,.7,.2,1); }
.ry-bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 38%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85), rgba(255,255,255,0)); animation: ryGlint 1.5s ease-in-out infinite; }
@keyframes ryGlint { from { transform: translateX(-120%); } to { transform: translateX(300%); } }
.ry-msg { margin: 2px 0 0; min-height: 1.4em; font: 400 13px/1.4 "Noto Serif SC", serif; letter-spacing: .12em; color: rgba(239,232,216,.62); }
.ry-hint { margin: 0; font-size: 12px; color: #e0b35a; max-width: 320px; }
.ry-hint[hidden] { display: none; }
.ry-fly { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #f3d98a; box-shadow: 0 0 10px 3px rgba(243,217,138,.55); opacity: 0; animation: ryFly 6s ease-in-out infinite; }
.ry-fly:nth-of-type(1) { left: 18%; top: 62%; animation-delay: -1s; } .ry-fly:nth-of-type(2) { left: 32%; top: 74%; animation-delay: -3s; }
.ry-fly:nth-of-type(3) { left: 66%; top: 68%; animation-delay: -2s; } .ry-fly:nth-of-type(4) { left: 80%; top: 78%; animation-delay: -4.5s; } .ry-fly:nth-of-type(5) { left: 48%; top: 82%; animation-delay: -0.5s; }
@keyframes ryFly { 0%, 100% { opacity: 0; transform: translate(0, 0); } 30%, 70% { opacity: .9; } 50% { transform: translate(14px, -46px); } }
#boot .en, .ry-veil .en { display: none; }
html.boot-en #boot .zh { display: none; } html.boot-en #boot .en { display: inline; }
@media (prefers-reduced-motion: reduce) { .ry-bar::after, .ry-fly { animation: none; } .ry-fill, #boot, .ry-veil { transition: none; } }
</style>

<body>
<div id="boot" role="status" aria-live="polite">
  <i class="ry-moon"></i><i class="ry-mist"></i><i class="ry-fly"></i><i class="ry-fly"></i><i class="ry-fly"></i><i class="ry-fly"></i><i class="ry-fly"></i>
  <div class="ry-core">
    <div class="ry-seal">刃</div>
    <div class="ry-title">刃影</div>
    <div class="ry-sub">RENYING</div>
    <div class="ry-bar"><i class="ry-fill" id="bootFill"></i></div>
    <p class="ry-msg"><span class="zh">研墨磨刃中……</span><span class="en">Sharpening the blade…</span></p>
    <p class="ry-hint" id="bootHint" hidden><span class="zh">载入太久？检查一下网络，再刷新页面。</span><span class="en">Taking long? Check your connection, then refresh the page.</span></p>
  </div>
</div>
<script>
/* 启动画面的小控制器：build.py 在每一段脚本之间插一句 RYBoot.p(进度)，游戏画出第一帧后 src/game/01-engine/25-keyboard-boot.js 调 RYBoot.done() 收起画面。
   不依赖任何游戏代码，所以脚本出错时画面也能提示用户刷新。 */
window.RYBoot = (function () {
  var el = document.getElementById('boot'), fill = document.getElementById('bootFill'), hint = document.getElementById('bootHint'), cur = 0, ended = false, t0 = Date.now();
  function showHint() { if (!ended && hint) hint.hidden = false; }
  var slow = setTimeout(showHint, 12000);
  window.addEventListener('error', function () { setTimeout(showHint, 1500); });
  return {
    p: function (v) { if (ended || v <= cur) return; cur = v; if (fill) fill.style.transform = 'scaleX(' + v + ')'; },
    done: function () {
      if (ended) return; ended = true; clearTimeout(slow);
      if (fill) fill.style.transform = 'scaleX(1)';
      setTimeout(function () { if (!el) return; el.classList.add('out'); setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); el = null; }, 700); }, Math.max(120, 450 - (Date.now() - t0)));
    }
  };
})();
</script>
